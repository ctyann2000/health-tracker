<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/health-tracker/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Personal AI Health Tracker - HealthApp">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HealthApp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HealthApp</title>
  <link rel="manifest" href="manifest.json">

  <!-- キャッシュ無効化（常に最新のビルドを取得） -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <script>
    // 1. Service Worker の新規登録を完全抑止（No-op / 即座に reject）
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register = function() {
        console.log('[SW] ServiceWorker registration blocked by application');
        return Promise.reject(new Error('ServiceWorker registration disabled'));
      };
      // 既存のすべての ServiceWorker を強制登録解除
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister().then(function(success) {
            console.log('[SW] Unregistered existing ServiceWorker:', success);
          });
        }
      });
    }

    // 2. ブラウザの CacheStorage を全て物理消去
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
          console.log('[Cache] Deleted cache:', names[i]);
        }
      });
    }

    // 3. Webカメラストリームの物理的強制停止 ＆ DOM video要素の完全消去関数
    window.forceStopAllCamerasAndRemoveVideos = function() {
      try {
        console.log('[CameraCleanup] Force stopping all camera tracks & removing video DOMs');
        var videos = document.querySelectorAll('video');
        videos.forEach(function(v) {
          try {
            if (v.srcObject && v.srcObject.getTracks) {
              v.srcObject.getTracks().forEach(function(t) {
                try { t.stop(); } catch (_) {}
              });
            }
            v.pause();
            v.srcObject = null;
            v.load();
          } catch (_) {}
          try {
            if (v.parentNode) {
              v.parentNode.removeChild(v);
            }
          } catch (_) {}
        });

        // flt-platform-view 残留の消去
        var pvs = document.querySelectorAll('flt-platform-view');
        pvs.forEach(function(pv) {
          try {
            if (pv.parentNode) {
              pv.parentNode.removeChild(pv);
            }
          } catch (_) {}
        });
      } catch (err) {
        console.error('[CameraCleanup] Error in force cleanup:', err);
      }
    };

    // jsQR CDNライブラリまたはネイティブBarcodeDetectorの統合
    // 4. 静止画バイト配列からのQRコード二重検出（BarcodeDetector ＋ jsQRフォールバック）
    window.detectQrFromBytes = async function(uint8Array) {
      var results = [];
      var blob = new Blob([uint8Array], { type: 'image/jpeg' });

      // 手法A: Chromeネイティブ BarcodeDetector（超高速）
      if ('BarcodeDetector' in window) {
        try {
          var detector = new BarcodeDetector({ formats: ['qr_code'] });
          var imgBitmap = await createImageBitmap(blob);
          var barcodes = await detector.detect(imgBitmap);
          for (var i = 0; i < barcodes.length; i++) {
            if (barcodes[i].rawValue && results.indexOf(barcodes[i].rawValue) === -1) {
              results.push(barcodes[i].rawValue);
            }
          }
          if (results.length > 0) {
            console.log('[QR] Native BarcodeDetector succeeded:', results.length);
            return results;
          }
        } catch (errNative) {
          console.warn('[QR] Native BarcodeDetector error, falling back to jsQR:', errNative);
        }
      }

      // 手法B: jsQR（高精度キャンバス解析フォールバック）
      if (typeof jsQR !== 'undefined') {
        try {
          var imgBitmap = await createImageBitmap(blob);
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d', { willReadFrequently: true });
          
          // 解像度調整（大きすぎるとjsQRが遅いので最大1600pxにスケール）
          var maxDim = 1600;
          var w = imgBitmap.width;
          var h = imgBitmap.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          canvas.width = w;
          canvas.height = h;
          ctx.drawImage(imgBitmap, 0, 0, w, h);
          
          var imgData = ctx.getImageData(0, 0, w, h);
          var code = jsQR(imgData.data, imgData.width, imgData.height, {
            inversionAttempts: "dontInvert",
          });
          if (code && code.data) {
            results.push(code.data);
            console.log('[QR] jsQR succeeded:', code.data.substring(0, 30));
          } else {
            // 反転（白黒反転）でも試行
            var codeInvert = jsQR(imgData.data, imgData.width, imgData.height, {
              inversionAttempts: "onlyInvert",
            });
            if (codeInvert && codeInvert.data) {
              results.push(codeInvert.data);
              console.log('[QR] jsQR (inverted) succeeded:', codeInvert.data.substring(0, 30));
            }
          }
        } catch (errJsQr) {
          console.warn('[QR] jsQR error:', errJsQr);
        }
      }

      console.log('[QR] Total detected QRs:', results.length);
      return results;
    };
  </script>
  <!-- jsQR 軽量QRコード解析ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <!-- Eruda スマホ用インスペクター＆コンソール（原因調査用） -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    try {
      eruda.init();
      console.log('[Eruda] Mobile DevTools initialized');
    } catch(e) {
      console.warn('[Eruda] Init failed', e);
    }
  </script>
</head>
<body>
  <script>
    // キャッシュバスターを付与して常に最新の flutter_bootstrap.js および main.dart.js をロード
    var cacheKey = new Date().getTime();
    
    // flutter_bootstrap.js 内の _flutter.loader.load をインターセプトして main.dart.js にキャッシュバスターを強制付与
    window._flutter = window._flutter || {};
    var originalBuildCallback = null;
    
    // スクリプトタグを生成してロード
    var script = document.createElement('script');
    script.src = 'flutter_bootstrap.js?v=' + cacheKey;
    script.async = true;
    script.onload = function() {
      console.log('[Bootstrap] flutter_bootstrap.js loaded with cachebuster:', cacheKey);
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
