<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Personal AI Health Tracker - HealthApp">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HealthApp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HealthApp</title>
  <link rel="manifest" href="manifest.json">

  <!-- キャッシュ無効化（常に最新のビルドを取得） -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <script>
    // 1. Service Worker の新規登録を完全抑止（No-op / 即座に reject）
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register = function() {
        console.log('[SW] ServiceWorker registration blocked by application');
        return Promise.reject(new Error('ServiceWorker registration disabled'));
      };
      // 既存のすべての ServiceWorker を強制登録解除
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister().then(function(success) {
            console.log('[SW] Unregistered existing ServiceWorker:', success);
          });
        }
      });
    }

    // 2. ブラウザの CacheStorage を全て物理消去
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
          console.log('[Cache] Deleted cache:', names[i]);
        }
      });
    }

    // 3. Webカメラストリームの物理的強制停止 ＆ DOM video要素の完全消去関数
    window.forceStopAllCamerasAndRemoveVideos = function() {
      try {
        console.log('[CameraCleanup] Force stopping all camera tracks & removing video DOMs');
        var videos = document.querySelectorAll('video');
        videos.forEach(function(v) {
          try {
            if (v.srcObject && v.srcObject.getTracks) {
              v.srcObject.getTracks().forEach(function(t) {
                try { t.stop(); } catch (_) {}
              });
            }
            v.pause();
            v.srcObject = null;
            v.load();
          } catch (_) {}
          try {
            if (v.parentNode) {
              v.parentNode.removeChild(v);
            }
          } catch (_) {}
        });

        // flt-platform-view 残留の消去
        var pvs = document.querySelectorAll('flt-platform-view');
        pvs.forEach(function(pv) {
          try {
            if (pv.parentNode) {
              pv.parentNode.removeChild(pv);
            }
          } catch (_) {}
        });
      } catch (err) {
        console.error('[CameraCleanup] Error in force cleanup:', err);
      }
    };

    // 4. ブラウザネイティブの BarcodeDetector を使った静止画バイト配列からのQRコード検出
    window.detectQrFromBytes = async function(uint8Array) {
      if (!('BarcodeDetector' in window)) {
        console.log('[QR] BarcodeDetector not available in this browser');
        return [];
      }
      try {
        var detector = new BarcodeDetector({ formats: ['qr_code'] });
        var blob = new Blob([uint8Array]);
        var imgBitmap = await createImageBitmap(blob);
        var barcodes = await detector.detect(imgBitmap);
        var results = [];
        for (var i = 0; i < barcodes.length; i++) {
          if (barcodes[i].rawValue) {
            results.push(barcodes[i].rawValue);
          }
        }
        console.log('[QR] Detected barcodes from bytes:', results.length);
        return results;
      } catch (e) {
        console.warn('[QR] Error detecting QR from bytes:', e);
        return [];
      }
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // キャッシュバスターを付与して常に最新の flutter_bootstrap.js を実行
    var script = document.createElement('script');
    script.src = 'flutter_bootstrap.js?v=' + new Date().getTime();
    script.async = true;
    document.body.appendChild(script);
  </script>
</body>
</html>
