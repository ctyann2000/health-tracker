name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env
        env:
          API_KEY: ${{ secrets.HEALTHAPPAPI || secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=$API_KEY" > .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        env:
          API_KEY: ${{ secrets.HEALTHAPPAPI || secrets.GEMINI_API_KEY }}
        run: flutter build web --release --base-href "/health-tracker/" --dart-define=GEMINI_API_KEY="$API_KEY"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
