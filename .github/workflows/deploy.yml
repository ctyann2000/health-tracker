name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure API Key
        run: |
          API_KEY="${{ secrets.HEALTHAPPAPI }}"
          if [ -z "$API_KEY" ]; then
            API_KEY="${{ secrets.GEMINI_API_KEY }}"
          fi
          echo "GEMINI_API_KEY=$API_KEY" > .env
          echo "GEMINI_API_KEY=$API_KEY" >> $GITHUB_ENV

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href "/health-tracker/" --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Deploy to GitHub Pages
        run: |
          cd build/web
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy HealthApp: ${{ github.sha }}"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:gh-pages
