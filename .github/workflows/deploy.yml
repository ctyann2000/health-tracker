name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create build .env
        run: |
          touch .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        env:
          KEY_PRIMARY: ${{ secrets.HEALTHAPPAPI }}
          KEY_SECONDARY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          RAW_KEY="$KEY_PRIMARY"
          if [ -z "$RAW_KEY" ]; then
            RAW_KEY="$KEY_SECONDARY"
          fi
          KEY_B64=$(echo -n "$RAW_KEY" | base64 -w 0)
          flutter build web --release --pwa-strategy none --base-href "/health-tracker/" --dart-define=GEMINI_API_KEY_B64="$KEY_B64"

      - name: Remove sensitive assets
        run: |
          rm -f build/web/assets/.env

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
